name: Website checks

on:
  pull_request:
  push:
    branches: [main, 'feat/**']

permissions:
  contents: read

concurrency:
  group: website-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Public CI may run only after these assets have explicit publication clearance.
      HERO_ASSET_DIR: src/assets/images
      UI_BASELINE_URL: http://127.0.0.1:4174
      AGENDA_BASELINE_URL: http://127.0.0.1:4185
      AGENDA_CLOSEOUT_BASELINE_URL: http://127.0.0.1:4187
      AGENDA_SIGNIN_BASELINE_URL: http://127.0.0.1:4188
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Checkout real pre-booking application for comparison
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: 0755fce62688e380a737db9e267bad22e35acf25
          path: .baseline-source
      - name: Build pinned real baseline
        run: node scripts/build.mjs
        working-directory: .baseline-source
      - name: Checkout real pre-role agenda for comparison
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: b3abca5b67ac2de7247c3f2d37801467c525473b
          path: .private-evidence/staff-role-baseline
      - name: Build pinned agenda baseline
        run: node scripts/build.mjs
        working-directory: .private-evidence/staff-role-baseline
      - name: Checkout exact pre-closeout application for comparison
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: 6efd7bb4fd101949c1deee9af00b7bc601028fb9
          path: .private-evidence/closeout-baseline
      - name: Build pinned closeout baseline
        run: node scripts/build.mjs
        working-directory: .private-evidence/closeout-baseline
      - name: Checkout exact pre-sign-in application for comparison
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: 59801861ab926343630ef6b847500ce790abc2d8
          path: .private-evidence/signin-baseline
      - name: Build pinned sign-in baseline
        run: node scripts/build.mjs
        working-directory: .private-evidence/signin-baseline
      - run: npm run check
      - run: npm run test:performance
      - name: Upload bounded staff sign-in evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staff-signin-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            agenda/.private-evidence/agenda-browser-results.json
            test-results/signin-browser-*/**/*.png
            test-results/signin-browser-*/**/*.webm
            test-results/signin-browser-*/**/signin-metadata.json
            test-results/signin-browser-*/**/error-context.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload test reports for this commit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: website-checks-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .private-evidence/playwright-results.json
            agenda/.private-evidence/agenda-browser-results.json
            .private-evidence/axe-results.json
            .private-evidence/budgets.json
            .private-evidence/network-budget-dpr*.json
            .private-evidence/network-initial-dpr*.json
            .private-evidence/lighthouse/*.json
            .private-evidence/hero-*.png
            .private-evidence/ui-*.png
            .private-evidence/ui-*.json
            test-results/**/*.png
            test-results/**/*.webm
            test-results/**/staff-roles-metadata.json
            test-results/**/reflow-layout.json
            test-results/**/closeout-metadata.json
            test-results/**/signin-metadata.json
            test-results/**/error-context.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
