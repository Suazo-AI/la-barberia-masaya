<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="La Barbería en Masaya, junto a Cailagua. Un espacio para tu próximo corte. Llamá para consultar."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#111110" />
    <title>La Barbería · Masaya, Cailagua</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link
      rel="preload"
      href="./assets/fonts/anton-latin.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <header class="masthead">
      <span class="wordmark">LA BARBERÍA</span>
      <span class="masthead-rule" aria-hidden="true"></span>
      <span class="location">MASAYA · CAILAGUA</span>
    </header>
    <main id="contenido" tabindex="-1">
      <section class="hero" aria-labelledby="hero-heading">
        <div class="hero-copy">
          <h1 id="hero-heading"><span>TU ESTILO.</span> <span>BIEN HECHO.</span></h1>
          <p class="hero-description">Un espacio para tu próximo corte.</p>
          <a class="call-action" href="tel:+50585482197">Llamar para consultar</a>
        </div>
        <figure class="hero-scene">
          <picture
            ><source media="(min-width: 1024px)" srcset="./assets/images/interior-1672.webp" />
            <source media="(min-width: 768px)" srcset="./assets/images/interior-1200.webp" />
            <img
              src="./assets/images/interior-720.webp"
              width="1672"
              height="941"
              alt="Vista frontal del interior de La Barbería, con dos sillas frente a una pared de ladrillo y tres lámparas. Imagen mejorada con IA a partir de una foto de 2023."
              fetchpriority="high"
          /></picture>
        </figure>
      </section>
      <section class="space-section" aria-labelledby="space-heading">
        <h2 id="space-heading">EL LOCAL</h2>
        <div class="space-grid">
          <figure class="space-tile space-tile-overview">
            <picture
              ><source
                media="(min-width: 768px)"
                srcset="./assets/images/local-overview-1000.webp" />
              <img
                src="./assets/images/local-overview-720.webp"
                width="1672"
                height="941"
                loading="lazy"
                decoding="async"
                alt="Vista alta del local: sillas, espejos y piso de cuadros. Imagen mejorada de 2023."
            /></picture>
          </figure>
          <figure class="space-tile space-tile-front">
            <picture
              ><source media="(min-width: 1024px)" srcset="./assets/images/interior-1672.webp" />
              <source media="(min-width: 768px)" srcset="./assets/images/interior-1200.webp" />
              <img
                src="./assets/images/interior-720.webp"
                width="1672"
                height="941"
                loading="lazy"
                decoding="async"
                alt="Vista frontal de las sillas y la pared de ladrillo. Imagen mejorada de 2023."
            /></picture>
          </figure>
          <figure class="space-tile space-tile-lamp">
            <picture
              ><source media="(min-width: 1024px)" srcset="./assets/images/interior-1672.webp" />
              <source media="(min-width: 768px)" srcset="./assets/images/interior-1200.webp" />
              <img
                src="./assets/images/interior-720.webp"
                width="1672"
                height="941"
                loading="lazy"
                decoding="async"
                alt="Detalle de una lámpara y el letrero, recortado de la vista frontal de 2023."
            /></picture>
          </figure>
          <figure class="space-tile space-tile-chair">
            <picture
              ><source
                media="(min-width: 768px)"
                srcset="./assets/images/local-overview-1000.webp" />
              <img
                src="./assets/images/local-overview-720.webp"
                width="1672"
                height="941"
                loading="lazy"
                decoding="async"
                alt="Detalle de una silla y el piso de cuadros, recortado de la vista alta de 2023."
            /></picture>
          </figure>
        </div>
      </section>
    </main>
    <footer class="draft-note">
      <p>
        Vista de diseño · Imágenes mejoradas con IA a partir de fotos de 2023. El aspecto actual del
        local puede variar.
      </p>
    </footer>
  </body>
</html>
